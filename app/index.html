<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעבדת α7C II</title>
<meta name="description" content="קורס וסימולטור בעברית ל-Sony α7C II עם עדשת FE 24-50mm F2.8 G">
<meta name="theme-color" content="#121316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Barlow+Condensed:wght@400;500;600&family=Secular+One&display=swap">
<style>
/* Layout: one dark "camera body" world, by choice. Reading column ~70ch for lessons; the simulator is a full-width instrument.
   Accent = Sony menu orange; green = AF lock; red = warnings. */
:root{
  color-scheme: dark;
  --body:#121316; --panel:#1b1d21; --panel-2:#23262b; --line:#33373e; --ink:#ecebe7; --mute:#a3a6ac; --soft:#d7d6d2;
  --accent:#f0892a; --af:#4be38f; --warn:#ff6655; --sky:#7fb3ff; --lcd:#000;
  --f-he:"Assistant","Arial Hebrew",system-ui,sans-serif; --f-display:"Secular One","Assistant",sans-serif;
  --f-cam:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--body);color:var(--ink);font-family:var(--f-he);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--accent)}
.note{color:var(--mute);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--body) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.brand span{font-family:var(--f-cam);color:var(--mute);letter-spacing:.05em}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-inline-start:auto}
.nav a{color:var(--soft);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:.95rem}
.nav a[aria-current="true"]{background:var(--panel-2);color:var(--ink)}
#progress{--p:0%;width:64px;height:6px;border-radius:3px;background:var(--panel-2);position:relative;overflow:hidden}
#progress::after{content:"";position:absolute;inset:0;width:var(--p);background:var(--af)}
.prog{display:flex;align-items:center;gap:6px;font-family:var(--f-cam);color:var(--mute);font-size:.85rem}
@media (max-width:640px){.nav{order:3;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap}.nav a{white-space:nowrap}}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:10px 26px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(1.8rem,5vw,2.9rem);margin-block:8px 12px}
.hero p{color:var(--soft);max-width:60ch;margin:0 0 18px}
.hero-art{display:grid;gap:8px;min-width:0}
.hero-top{width:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.hero-lens .lens-ctl,.hero-lens .lens-extra{display:none}
.hero-body{position:relative;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}.hero-body svg{width:100%;height:auto;display:block}
.hero-screen{position:absolute;background:#000 center/cover no-repeat}
.hero-lens .l3-views,.hero-lens .l3-read,.hero-lens .cap{display:none}
.qart{width:110px;height:72px;border-radius:8px;background:#0c0d0f;display:grid;place-items:center;overflow:hidden}.qart svg,.qart img{width:100%;height:100%;object-fit:contain}
/* figures */
.body-fig .art{position:relative;width:100%;max-width:100%;background:radial-gradient(ellipse at 50% 55%,#2b2e34,#141518 72%);border:1px solid var(--line);border-radius:var(--r);padding:0}
.body-fig .art{padding:3%}.body-fig .art-in{position:relative}.body-fig .art > svg{display:block;width:100%;height:auto}
.fmk{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:0;background:var(--accent);color:#1a1205;font:700 12px/22px var(--f-cam);padding:0;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:2}
.fmk.is-on{background:var(--af)}
@media (max-width:560px){.fmk{width:18px;height:18px;font-size:10px;line-height:18px}}
.legend li.is-on{border-color:var(--af)}
[data-part].is-on{filter:drop-shadow(0 0 2px var(--af)) brightness(1.35)}
.lens3d-fig{display:grid;gap:8px}
.l3f{position:relative;width:100%;aspect-ratio:16/10;background:radial-gradient(ellipse at 50% 55%,#2b2e34,#121316 75%);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
.l3f canvas{width:100%;height:100%;display:block}
.l3-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute)}
.l3-views{display:flex;gap:6px;flex-wrap:wrap}
.l3-views button{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;color:var(--soft)}
.l3-views button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.l3-read{color:var(--soft);font-size:.92rem}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#1a1205;border:0;border-radius:10px;padding:11px 18px;font-weight:700;text-decoration:none;font-size:1rem}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-block:8px 30px}
@media (max-width:760px){.quick{grid-template-columns:minmax(0,1fr)}}
.qcard{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;color:var(--ink)}
.qcard img,.qcard .qlens{width:110px;height:72px;object-fit:cover;border-radius:8px;background:#0c0d0f}
.qcard .qlens svg{width:100%;height:100%}
.qcard b{display:block}.qcard span{color:var(--mute);font-size:.9rem}
.course h2{font-size:1.5rem;margin-bottom:12px}
.chapter{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.chapter summary{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.chapter summary::-webkit-details-marker{display:none}
.chnum{font-family:var(--f-cam);font-size:1.6rem;color:var(--accent);text-align:center}
.cht b{display:block;font-size:1.05rem}.cht span{color:var(--mute);font-size:.9rem}
.chp{font-family:var(--f-cam);color:var(--mute)}
.lessons{list-style:none;margin:0;padding:0 0 8px}
.lessons a{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;padding:8px 14px;color:var(--soft);text-decoration:none;border-top:1px solid #26292e}
.lessons a:hover{background:var(--panel-2)}
.lessons .lid{font-family:var(--f-cam);color:var(--mute)}
.lessons .lm{color:var(--mute);font-size:.85rem}
.lessons li.done .lt::after{content:" ✓";color:var(--af)}
.foot{margin-top:26px;color:var(--mute)}

/* ---------- lesson ---------- */
.lesson{max-width:820px;margin:0 auto}
.crumbs{font-size:.9rem;color:var(--mute);margin-bottom:10px}.crumbs a{color:var(--mute)}
.l-head h1{font-size:clamp(1.6rem,4.5vw,2.3rem);margin-block:4px 10px}
.goal{color:var(--soft);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:70ch}
.blocks{display:grid;gap:18px;margin-top:22px}
.b-p p{margin:0;max-width:70ch;color:var(--soft)}
.b-h h2{font-size:1.35rem;margin-top:8px}
kbd,.en{font-family:var(--f-cam);font-size:1.02em;letter-spacing:.02em}
kbd{background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.call{border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);background:var(--panel)}
.call .ct{font-size:.8rem;letter-spacing:.04em;border-radius:6px;padding:1px 8px;white-space:nowrap;margin-top:3px}
.call.tip .ct{background:color-mix(in srgb,var(--af) 18%,transparent);color:var(--af)}
.call.warn .ct{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.call.pro .ct{background:color-mix(in srgb,var(--sky) 18%,transparent);color:var(--sky)}
.b-steps ol{margin:0;padding-inline-start:1.4em;display:grid;gap:6px;color:var(--soft)}
.b-steps li::marker{color:var(--accent);font-family:var(--f-cam);font-weight:600}
.b-menu{background:#0b0b0d;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-cam);font-size:1.02rem}
.mp{background:#1c1e22;border:1px solid #2f3238;border-radius:5px;padding:1px 8px}.mp.m0{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.mv{color:var(--af)} .msep{color:var(--mute)} .mnote{color:var(--mute);font-size:.9rem;margin-top:6px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.b-table table{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
.b-table th,.b-table td{padding:7px 10px;border-bottom:1px solid #2a2d33;text-align:start;vertical-align:top}
.b-table th{background:var(--panel-2);font-weight:600;white-space:nowrap}
.b-recipe{background:linear-gradient(160deg,#1e2126,#17191c);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r);padding:12px 16px}
.b-recipe .rt{font-family:var(--f-display);font-size:1.1rem;margin-bottom:6px}
.b-recipe dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0}
.b-recipe dt{color:var(--mute)} .b-recipe dd{margin:0;font-family:var(--f-cam);font-size:1.05rem}
.b-quiz{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.qq{font-weight:600;margin-bottom:10px}
.qo{display:grid;gap:8px}
.qo button{text-align:start;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.qo button.right{border-color:var(--af);background:color-mix(in srgb,var(--af) 14%,var(--panel-2))}
.qo button.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel-2))}
.qe{margin-top:10px;color:var(--soft)}
.l-foot{margin-top:34px;display:grid;gap:16px;justify-items:start}
.pn{display:flex;justify-content:space-between;gap:12px;width:100%;flex-wrap:wrap}
.pn-a{color:var(--soft);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
.cap{color:var(--mute);font-size:.9rem;margin-top:6px}

/* ---------- figures ---------- */
.fig{display:grid;gap:12px}
.photo-fig{background:radial-gradient(ellipse at 50% 60%,#2a2d33,#141518 70%);border-radius:var(--r);border:1px solid var(--line);padding:3% 3% 2%}
.photo-fig .ph{position:relative;width:100%;max-width:100%}
.photo-fig img,.photo-fig .ph > svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ph .scr{position:absolute;background:#000 center/cover no-repeat;border-radius:1px;overflow:hidden}
.ph .scr{container-type:inline-size}.ph .scr .osd{font-size:clamp(6px,2.4cqw,12px)}
.ph-cap{color:var(--mute);font-size:.82rem;margin-top:4px}
.mk{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;width:0;height:0}
.mk .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.6);min-width:22px;pointer-events:none}
.photo-fig .mk .ring{width:auto}
.mk .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#1a1205;font:700 12px/22px var(--f-cam);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.mk.on .num{background:var(--af)} .mk.on .ring{border-color:var(--af);animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--af) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.photo-fig .ph .mk{width:44px;height:44px}
@media (max-width:560px){.mk .num{width:17px;height:17px;font-size:10px;line-height:17px}.mk .ring{min-width:14px;border-width:1.5px}.photo-fig .ph .mk{width:30px;height:30px}.photo-fig{padding:2%}}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.legend li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.legend li.on{border-color:var(--af)}
.lg-btn{display:flex;gap:8px;align-items:flex-start;background:none;border:0;padding:0;text-align:start;width:100%}
.lg-btn .num{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#1a1205;font:700 12px/22px var(--f-cam);text-align:center}
.lg-btn .en{color:var(--mute);font-size:.9rem;display:block}
.lg-d{color:var(--soft);font-size:.92rem;margin-top:4px;padding-inline-start:30px}
.fig-sub{border-top:1px dashed var(--line);padding-top:10px}
.schem .sl{font:3px var(--f-he);fill:var(--mute);text-anchor:middle}
/* lens */
.lens-fig{display:grid;gap:10px}
.lens-draw{max-width:620px;width:100%;margin-inline:auto;background:radial-gradient(ellipse at 50% 55%,#2b2e34,#141518 72%);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.lens-svg{width:100%;height:auto;display:block}
.lens-svg .rib{stroke:#55585f;stroke-width:.32}
.lens-svg .lmk{font:4.1px var(--f-cam);fill:#d8d8d8}.lens-svg .lmk.on{fill:#fff;font-weight:600}.lens-svg .lmk.a{fill:#f04a32}
.lens-svg .prt{font:3.7px var(--f-cam);fill:#e9e9e9;letter-spacing:.15px}.lens-svg .gb{font:700 5.4px var(--f-he);fill:#111}
.lens-svg .sm{font:2.5px var(--f-cam);fill:#cfcfcf}.lens-svg .sm.tiny{font-size:2px}
.lens-svg .dim line{stroke:var(--mute);stroke-width:.3}.lens-svg .dim text{font:3.2px var(--f-he);fill:var(--mute)}
.lens-svg .pt{cursor:pointer}.lens-svg .pt.hl,.lens-svg .pt.on{stroke:var(--accent);stroke-width:.9;filter:drop-shadow(0 0 1.5px var(--accent))}
.lens-svg .pt.on{stroke:var(--af)}
.lens-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:center}
.lc{display:grid;grid-template-columns:auto minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:.92rem}
.lc input{width:100%;accent-color:var(--accent)} .lc b{font-family:var(--f-cam);font-weight:500}
.sw-row{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--f-cam)}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.lens-extra{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.lens-extra > div{display:flex;gap:10px;align-items:center}
.lens-extra .cap{margin:0}
.lens-front .lf{font:4px var(--f-cam);fill:#e6e6e6}
.seg-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.seg-tabs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--soft)}
.seg-tabs button[aria-selected="true"]{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:8px 0 0}.kv dt{color:var(--mute)}.kv dd{margin:0}
.explorer .l-head,.labpage .l-head{margin-bottom:14px}

/* ---------- simulator ---------- */
.b-sim{scroll-margin-top:70px}
.sim-poster{position:relative;border-radius:var(--r);overflow:hidden;background:#000 center/cover no-repeat;min-height:220px;display:flex;align-items:flex-end;border:1px solid var(--line)}
.sp-in{position:relative;width:100%;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.85) 35%)}
.sp-in p{margin:4px 0 10px;color:#eee;max-width:60ch}
.sim{display:grid;gap:12px}
.sim-task{background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:var(--r);padding:12px 14px}
.sim-task p{margin:4px 0 8px}
.sim-task .checks{margin:0;padding-inline-start:1.3em;display:grid;gap:3px;color:var(--soft)}
.sim-task .checks li.ok{color:var(--af)} .sim-task .checks li.bad{color:var(--warn)}
.hint summary{color:var(--accent);cursor:pointer;margin-top:6px}
.sim-stage{position:relative}
.lcd{container-type:inline-size;position:relative;aspect-ratio:3/2;width:100%;max-width:100%;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 6px #0b0b0c,0 0 0 7px #2b2d31,0 14px 34px rgba(0,0,0,.5);touch-action:none;user-select:none;-webkit-user-select:none}
.lcd .view{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (max-width:979px){ .sim .lcd{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:5} }
.sim.framed .sim-stage{position:relative}
.sim.framed .rearframe img{width:100%;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.sim.framed .lcd{position:absolute;left:11.3%;top:34.8%;width:57.8%;height:60.5%;aspect-ratio:auto;box-shadow:none;border-radius:2px}
.osd{position:absolute;inset:0;font-family:var(--f-cam);color:#fff;text-shadow:0 0 2px #000,0 1px 2px #000;pointer-events:none;direction:ltr;font-size:clamp(8px,2.45cqw,16px);letter-spacing:.02em}
.sim.framed .osd{font-size:clamp(8px,2.3cqw,14px)}
.osd .row{position:absolute;display:flex;gap:.8em;align-items:center;white-space:nowrap}
.osd .tl{top:3.5%;left:2.5%}.osd .tr{top:3.5%;right:2.5%}
.osd .lc{left:2.5%;top:14%;flex-direction:column;align-items:flex-start;gap:.22em;display:flex;line-height:1.2}
.osd .bot{bottom:3%;left:2.5%;right:2.5%}
.osd .ex{display:flex;gap:1.1em;font-size:1.25em;font-weight:500;font-variant-numeric:tabular-nums}
.mode-box{border:1.5px solid #fff;border-radius:3px;padding:0 .35em;font-weight:600;font-size:1.15em;line-height:1.25}
.blink{animation:blink .9s steps(2,end) infinite}@keyframes blink{50%{opacity:0}}
.af-frame{position:absolute;border:2px solid rgba(255,255,255,.85);pointer-events:none}
.af-frame.ok{border-color:var(--af)}.af-frame.fail{border-color:var(--warn)}
.mfbar{position:absolute;left:20%;right:20%;bottom:13%;height:1.3em;border-bottom:1px solid #fff;display:flex;justify-content:space-between;font-size:.8em}
.mfbar .pin{position:absolute;bottom:-4px;width:2px;height:12px;background:var(--accent)}
.osd .hist,.review .hist{position:absolute;right:2.5%;bottom:13%;width:22%;aspect-ratio:3/2;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35)}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);padding:.4em .9em;border-radius:4px;font-family:var(--f-he);direction:rtl;max-width:86%;text-align:center;font-size:1em;line-height:1.4}
.loading{position:absolute;inset:0;display:grid;place-items:center;align-content:center;background:#000;font-family:var(--f-he);color:var(--mute)}
.loading .bar{width:46%;height:3px;background:#222;margin-top:10px;overflow:hidden}.loading .bar i{display:block;height:100%;background:var(--accent);width:0}
.err-box{padding:20px;text-align:center}.err-box span{color:var(--warn)}
.fn{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,12,.86);padding:1.2% 1.5%;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;direction:ltr;font-family:var(--f-cam)}
.fn button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:.35em .2em;font-size:clamp(9px,1.9vw,14px);line-height:1.15;text-align:center;min-height:3.1em}
.fn button small{display:block;color:#bbb;font-size:.78em}.fn button.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 30%,transparent)}
.picker{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,12,.9);direction:ltr;font-family:var(--f-cam);padding:1.2% 2%;display:flex;flex-direction:column;gap:6px}
.picker .ttl{font-size:clamp(11px,2.1vw,15px);color:#ddd}
.picker .opts{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.picker .opts button{flex:0 0 auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:.3em .7em;font-size:clamp(11px,2.1vw,15px);white-space:nowrap}
.picker .opts button.sel{background:var(--accent);border-color:var(--accent);color:#111}
.picker .ok{align-self:flex-end;padding:3px 12px}
.review{position:absolute;inset:0;background:#000}
.review canvas.shot{position:absolute;inset:0;width:100%;height:100%}
.review .info{position:absolute;left:2.5%;top:3%;font-family:var(--f-cam);direction:ltr;font-size:clamp(11px,2vw,15px);text-shadow:0 1px 2px #000}
.review .hist{bottom:4%}
.review .close{position:absolute;right:2%;top:3%;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:.2em .7em;font-family:var(--f-he);font-size:clamp(11px,2vw,15px)}
.review .verdict{position:absolute;left:2.5%;right:27%;bottom:4%;font-family:var(--f-he);direction:rtl;background:rgba(0,0,0,.7);border-radius:6px;padding:.4em .7em;font-size:clamp(11px,2.2vw,15px);line-height:1.45}
.verdict .ok{color:var(--af)}.verdict .bad{color:var(--warn)}
.lcd-cap{display:flex;justify-content:space-between;gap:12px;color:var(--mute);font-size:.82rem;flex-wrap:wrap;margin-top:4px}.lcd-cap a{color:var(--mute)}
.deck{background:linear-gradient(#202226,#191a1d);border:1px solid var(--line);border-radius:14px;padding:12px;direction:ltr;display:grid;gap:12px}
.deck .grp{display:grid;gap:10px}
.top-row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.dials{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.dials{grid-template-columns:minmax(0,1fr)}}
.back-row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.lab{font-family:var(--f-cam);font-size:.82rem;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.lab b{color:var(--ink);font-weight:500}.lab.he{font-family:var(--f-he);direction:rtl}
.modedial{display:flex;background:#111214;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
.modedial button{flex:1;background:none;border:0;padding:8px 0;font-family:var(--f-cam);font-weight:600;font-size:1.05rem;color:#cfd0d2;border-inline-end:1px solid #26282c}
.modedial button:last-child{border:0}.modedial button[aria-pressed="true"]{background:#e9e7e2;color:#111}
.modedial button.locked{opacity:.55}
.shutter{width:66px;height:66px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#5b5e64,#2a2c30 70%);box-shadow:0 0 0 4px #0e0f10,0 0 0 6px #3a3d42,inset 0 -3px 6px rgba(0,0,0,.6);touch-action:none;position:relative;margin-bottom:24px}
.shutter.half{box-shadow:0 0 0 4px #0e0f10,0 0 0 6px var(--af),inset 0 -3px 6px rgba(0,0,0,.6)}
.shutter span{position:absolute;inset:auto -30px -30px;font-size:.66rem;line-height:1.2;color:var(--mute);font-family:var(--f-he);direction:rtl;pointer-events:none}
.dial,.ring{display:grid;gap:4px;min-width:0}
.ring.dim{opacity:.55}
.knurl{height:36px;border-radius:6px;cursor:ew-resize;touch-action:none;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#2d3035 0 3px,#17181b 3px 7px);box-shadow:inset 0 8px 10px rgba(0,0,0,.55),inset 0 -8px 10px rgba(0,0,0,.55);border:1px solid #3a3d42}
.knurl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),transparent 30%,transparent 70%,rgba(0,0,0,.65));pointer-events:none}
.knurl .arr{position:absolute;top:0;bottom:0;width:30%;z-index:1;background:none;border:0;color:#aaa;font-size:1rem}
.knurl .arr.l{left:0;text-align:left;padding-left:8px}.knurl .arr.r{right:0;text-align:right;padding-right:8px}
.ring .marks{display:flex;justify-content:space-between;font-family:var(--f-cam);font-size:.78rem;color:var(--mute);padding-inline:2px}
.ring .marks .cur{color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:#2a2c31;border:1px solid #3c3f45;border-radius:7px;padding:8px 12px;font-family:var(--f-cam);font-weight:500;font-size:.95rem;min-width:52px}
.btn:active{transform:translateY(1px)}
.wheel{width:120px;height:120px;border-radius:50%;position:relative;background:radial-gradient(circle,#1b1c1f 34%,#2c2f34 35%,#202226 70%);border:1px solid #3c3f45}
.wheel button{position:absolute;background:none;border:0;font-family:var(--f-cam);font-size:.8rem;color:#cfd0d2;padding:6px}
.wheel .u{top:2px;left:50%;transform:translateX(-50%)}.wheel .d{bottom:2px;left:50%;transform:translateX(-50%)}
.wheel .l{left:2px;top:50%;transform:translateY(-50%)}.wheel .r{right:2px;top:50%;transform:translateY(-50%)}
.wheel .c{left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#2f3237;border:1px solid #44474d;font-size:.7rem}
.lens-deck{display:grid;gap:10px;background:#111214;border:1px solid var(--line);border-radius:10px;padding:10px}
.switches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:flex;border:1px solid #3c3f45;border-radius:6px;overflow:hidden;font-family:var(--f-cam);font-size:.85rem}
.sw button{background:#1c1e21;border:0;padding:6px 10px;color:#bbb}.sw button[aria-pressed="true"]{background:#e9e7e2;color:#111}
.sw-lab{font-family:var(--f-he);color:var(--mute);font-size:.8rem}
.scene-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--soft)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.credits ul{display:grid;gap:6px;color:var(--soft)} .credits h2{font-size:1.2rem;margin-top:20px}

/* ---------- camera surface (the simulator's controls are the camera itself) ---------- */
.surface{display:block}
.cam-surface{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);direction:ltr;position:relative}
@media (min-width:980px){.sim:not(.screen-in-body) .cam-surface{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:center}}
.screen-in-body .cam-surface{grid-template-columns:minmax(0,1fr)}
.cam-rig{width:100%;max-width:880px;margin-inline:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.cam-rig{width:100%}
.cam-top svg,.cam-rear svg{width:100%;height:auto;display:block;overflow:visible}
.cam-rear{position:relative;margin-top:-1px}
.cam-surface [data-part]{cursor:pointer}
.cam-surface [data-part].pressed{filter:brightness(1.6)}
.cam-lens-wrap{display:grid;gap:4px;justify-items:center;min-width:0;overflow:hidden}
.cam-lens{width:100%;max-width:760px;aspect-ratio:2.2/1;touch-action:none;position:relative}
.cam-lens canvas{width:100%;height:100%;display:block}
.cam-lens-cap{font-family:var(--f-he);direction:rtl;color:var(--mute);font-size:.82rem}
.cam-lens-fail{color:var(--mute);font-family:var(--f-he);direction:rtl;padding:20px;text-align:center}
.cam-cap{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:rgba(12,12,14,.92);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-family:var(--f-he);direction:rtl;font-size:.88rem;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s;pointer-events:none;z-index:6}
.cam-cap.show{opacity:1}
.lcd.in-body{box-shadow:none;border-radius:1px}
.acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;direction:ltr;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* =====================================================================
   Full-screen camera (phones first). Portrait: screen on top, controls below — one screen, no scrolling.
   Landscape / desktop: screen on the left, control panel on the right, like holding the camera.
   ===================================================================== */
html.sim-open,html.sim-open body{overflow:hidden;overscroll-behavior:none}
.sim-host{position:fixed;inset:0;z-index:100}
.sim.sim-fs{position:absolute;inset:0;display:flex;flex-direction:column;gap:0;background:#060708;color:var(--ink);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
.sim-fs button{-webkit-tap-highlight-color:transparent}
.sim-top{flex:0 0 auto;height:50px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:0 10px;direction:rtl}
.sim-x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-size:15px;color:#ddd}
.sim-title,.sim-scene{justify-self:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:.98rem;background:none;border:0;color:var(--ink);display:flex;gap:6px;align-items:center}
.sim-scene i{font-style:normal;color:var(--accent);font-size:.8rem}
.sim-pill{display:flex;gap:7px;align-items:center;background:rgba(240,137,42,.12);border:1px solid rgba(240,137,42,.55);color:var(--accent);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:600}
.sim-pill .dots{display:flex;gap:3px}
.sim-pill .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
.sim-pill .dots i.ok{background:var(--af)}.sim-pill .dots i.bad{background:var(--warn)}
.sim-pill.done{background:rgba(75,227,143,.14);border-color:var(--af);color:var(--af)}
.sim-main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.sim-fs .vf{flex:0 0 auto;padding:0 6px;display:flex;flex-direction:column;align-items:center}
.sim-fs .lcd{position:relative;top:auto;z-index:auto;width:100%;aspect-ratio:3/2;border-radius:10px;box-shadow:0 0 0 1px #23262b,0 10px 30px rgba(0,0,0,.6)}
.sim-fs .lcd-cap{display:block;width:100%;font-size:.66rem;color:#6f737a;padding:3px 4px 0;direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-fs .lcd-cap a{color:inherit}
.sim-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.deck-host{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.dk{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:8px 10px 10px;direction:rtl}

/* chips */
.dk-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;touch-action:pan-x;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent)}
.dk-chips::-webkit-scrollbar{display:none}
.dk-grp{flex:0 0 auto;align-self:center;font-size:.66rem;letter-spacing:.06em;color:var(--accent);padding:0 6px 0 2px;opacity:.85}
.dk-chip{flex:0 0 auto;min-width:62px;display:grid;justify-items:center;gap:1px;padding:5px 10px 6px;border-radius:12px;background:#121417;border:1px solid #24272c;color:var(--ink);transition:background .15s,border-color .15s}
.dk-chip small{font-size:.66rem;color:var(--mute);white-space:nowrap}
.dk-chip b{font-family:var(--f-cam);font-weight:600;font-size:1.04rem;white-space:nowrap;letter-spacing:.01em}
.dk-chip[aria-selected="true"]{border-color:var(--accent);background:linear-gradient(180deg,rgba(240,137,42,.22),rgba(240,137,42,.08))}
.dk-chip.auto b{color:#9ea3aa}
.dk-chip.auto small::after{content:" · אוטו";color:#7c8188}
.dk-chip.lock{opacity:.5}
.dk-chip.lock small::before{content:"🔒 "}

/* where-it-is card */
.dk-card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center;min-height:64px}
.dk-glyph{width:112px;position:relative}
.gl-body{position:relative;width:100%}
.gl-body svg{display:block;width:100%;height:auto}
.gl-dot{position:absolute;width:var(--r);min-width:16px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(240,137,42,.22),0 0 14px rgba(240,137,42,.9);animation:glp 1.5s ease-in-out infinite;pointer-events:none}
@keyframes glp{50%{box-shadow:0 0 0 7px rgba(240,137,42,0),0 0 22px rgba(240,137,42,1)}}
.gl-lens{width:100%;aspect-ratio:2/1;position:relative}
.gl-lens .l3,.gl-lens .l3-host{width:100%!important;height:100%!important;aspect-ratio:auto!important;background:none!important;border:0!important}
.gl-lens .l3-badge{display:none!important}
.gl-wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:.75rem}
.dk-read{min-width:0}
.dk-name{font-size:.76rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-name span{font-family:var(--f-cam);letter-spacing:.03em}
.dk-big{font-family:var(--f-cam);font-weight:600;font-size:clamp(1.35rem,6vw,1.85rem);line-height:1.1;unicode-bidi:plaintext;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-big.auto{color:#aeb3ba}
.dk-loc{font-size:.76rem;color:var(--soft);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dk-loc b{color:var(--accent);font-weight:600}

/* the thumb dial */
.ruler{position:relative;flex:0 0 auto;height:78px;border-radius:16px;overflow:hidden;background:linear-gradient(#111215,#0a0b0d);border:1px solid #22252a;touch-action:none;cursor:grab;outline:none}
.ruler.grab{cursor:grabbing}
.ruler:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.ru-scale{position:absolute;left:0;right:0;top:6px;height:36px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)}
.ru-track{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
.ru-it{flex:0 0 auto;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.ru-lb{font-family:var(--f-cam);font-size:14px;color:#b9bdc3;white-space:nowrap;transition:transform .12s ease,color .12s ease}
.ru-it.on .ru-lb{color:#fff;font-weight:600;transform:scale(1.22)}
.ru-tk{width:1.5px;height:8px;border-radius:1px;background:#70747b}
.ru-it.minor .ru-tk{height:5px;opacity:.6}
.ru-it.on .ru-tk{background:var(--accent)}
.ru-band{position:absolute;left:10px;right:10px;bottom:7px;height:24px;border-radius:7px;
  background:repeating-linear-gradient(90deg,#45484f 0 2px,#1a1b1e 2px 6px);
  box-shadow:inset 0 9px 9px rgba(0,0,0,.7),inset 0 -9px 9px rgba(0,0,0,.7);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.ruler[data-style="ring"] .ru-band{background:repeating-linear-gradient(90deg,#2d2f34 0 3px,#0f1012 3px 8px)}
.ruler[data-style="menu"] .ru-band,.ruler[data-style="menu"] .ru-tk{display:none}
.ruler[data-style="menu"] .ru-scale{top:0;height:100%}
.ruler[data-style="menu"] .ru-it{justify-content:center}
.ruler[data-style="menu"] .ru-lb{font-size:15px;padding:7px 9px;border-radius:9px}
.ruler[data-style="menu"] .ru-it.on .ru-lb{background:var(--accent);color:#141005;transform:none}
.ru-needle{position:absolute;left:50%;top:auto;height:36px;bottom:3px;width:2px;margin-left:-1px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px rgba(240,137,42,.75);pointer-events:none}
.ruler[data-style="menu"] .ru-needle{display:none}
.ruler.as-grid{height:auto;min-height:60px;cursor:default;padding:8px}
.ruler.as-grid .ru-scale{position:static;height:auto;-webkit-mask-image:none;mask-image:none}
.ruler.as-grid .ru-track{position:static;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;transform:none!important}
.ruler.as-grid .ru-it{height:auto;cursor:pointer}
.ruler.as-grid .ru-lb{display:block;padding:9px 12px;border-radius:10px;background:#181a1e;border:1px solid #2a2d33}
.ruler.as-grid .ru-it.on .ru-lb{background:var(--accent);border-color:var(--accent);color:#141005}
.ruler.is-disabled{cursor:not-allowed}
.ruler.is-disabled .ru-scale,.ruler.is-disabled .ru-band{opacity:.38}
.ruler.is-disabled .ru-needle{background:#7b7f86;box-shadow:none}

.dk-msg{font-size:.8rem;color:var(--soft);line-height:1.35;min-height:1.1em}
.dk-msg:empty{display:none}
.dk-msg.warn{color:#ffd5ad}
.dk-act{margin-inline-start:6px;background:var(--accent);color:#161005;border:0;border-radius:999px;padding:3px 11px;font-weight:700;font-size:.78rem}

/* buttons + shutter: shutter under the right thumb */
.dk-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr;padding-inline-end:6px}
.dk-btns{display:flex;gap:6px;min-width:0}
.dk-btns button{width:54px;height:54px;border-radius:15px;background:#15171a;border:1px solid #282b31;display:grid;place-content:center;gap:1px;color:var(--ink);padding:0;transition:transform .08s}
.dk-btns button:active,.dk-btns button.down{transform:scale(.95);border-color:var(--af);background:#16241c}
.dk-btns b{font-family:var(--f-cam);font-weight:600;font-size:15px;line-height:1}
.dk-btns span{font-size:10px;color:var(--mute)}
.dk-shutter{flex:0 0 auto;width:78px;height:78px;border-radius:50%;border:0;padding:0;position:relative;touch-action:none;
  background:radial-gradient(circle at 50% 38%,#ffffff,#d9dce0 58%,#a9adb3);
  box-shadow:0 0 0 4px #060708,0 0 0 7px #d4d7db,0 8px 20px rgba(0,0,0,.6);transition:transform .08s,box-shadow .15s}
.dk-shutter.half{transform:scale(.95);box-shadow:0 0 0 4px #060708,0 0 0 7px var(--af),0 0 24px rgba(75,227,143,.55)}
.dk-shutter:active{transform:scale(.93)}
.dk-stats{display:flex;gap:14px;justify-content:center;font-size:.72rem;color:var(--mute);white-space:nowrap;overflow:hidden}
.dk-stats .bad{color:var(--warn)}

/* sheets */
.sim-sheet{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh-in{width:100%;max-width:560px;max-height:86%;overflow:auto;touch-action:pan-y;background:#15171a;border:1px solid #2a2d33;border-bottom:0;border-radius:20px 20px 0 0;
  padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));direction:rtl;display:grid;gap:12px;-webkit-user-select:text;user-select:text}
.sh-in .tk-text{margin:0;font-size:1.02rem;line-height:1.55}
.sh-in .checks{margin:0;padding-inline-start:1.3em;display:grid;gap:4px;color:var(--soft)}
.sh-in .checks li.ok{color:var(--af)}.sh-in .checks li.bad{color:var(--warn)}
.sh-in .cta{justify-content:center}
.acc-grid{display:grid;gap:10px}
